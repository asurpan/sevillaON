<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ON AIR SPAIN - Red Social de Voz Táctica</title>
    <meta name="description" content="La red de radio CB táctica definitiva. Comunicación por voz en tiempo real, radar GPS en vivo y planificación de rutas tácticas para motos, ciclismo y aventuras.">
    <meta name="keywords" content="radio cb, walkie talkie, radar gps, rutas moto, navegacion tactica, on air spain, red social de voz, ptt, vox">
    <meta name="author" content="On Air Spain">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://asurpan.github.io/sevillaON/">
    <meta property="og:title" content="ON AIR SPAIN - Red Social de Voz Táctica">
    <meta property="og:description" content="Comunicación por voz real, radar GPS y rutas tácticas. Únete a la frecuencia.">
    <meta property="og:image" content="https://asurpan.github.io/sevillaON/logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://asurpan.github.io/sevillaON/">
    <meta property="twitter:title" content="ON AIR SPAIN - Red Social de Voz Táctica">
    <meta property="twitter:description" content="Comunicación por voz real, radar GPS y rutas tácticas. Únete a la frecuencia.">
    <meta property="twitter:image" content="https://asurpan.github.io/sevillaON/logo.png">

    <!-- Mobile App Support -->
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0F172A; }

        /* 📻 LA RADIO: Vive en la capa superior pero con "agujero" central opcional */
        #radio-root {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Dejar pasar clics al mapa por defecto */
        }

        /* Permitir clics en la radio (los botones se gestionan internamente) */
        #radio-root > * { pointer-events: auto; }

        /* 🗺️ EL MAPA: Ajustado dinámicamente por la radio */
        #activity-map-container {
            display: none;
            position: fixed;
            z-index: 0;
            border-radius: 28px;
            background: #020617;
            pointer-events: auto;
            overflow: hidden;
        }

        .leaflet-container { background: #020617 !important; }

        /* 🛣️ ESTILOS DE RUTA GPS */
        .leaflet-routing-container {
            background: rgba(15, 23, 42, 0.9) !important;
            color: white !important;
            border-radius: 16px !important;
            border: 1px solid #D4AF37 !important;
            font-family: sans-serif !important;
            font-size: 11px !important;
            max-width: 200px !important;
            display: none !important; /* Ocultar panel de texto por defecto para diseño táctico */
        }
    </style>

    <!-- Librerías Críticas -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- 🗺️ MAPAS Y RUTAS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
</head>
<body>
    <div id="activity-map-container"></div>
    <div id="radio-root"></div>

    <script>
        const script = document.createElement('script');
        script.src = 'webApp.js?v=' + Date.now();
        document.body.appendChild(script);
    </script>
</body>
</html>
