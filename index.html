<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ON AIR SPAIN | Red Social de Voz</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0F172A; }

        #radio-root {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        #radio-root > * { pointer-events: auto; }

        #activity-map-container {
            display: none;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
            background: #020617;
            pointer-events: auto !important;
        }

        .leaflet-container { background: #020617 !important; }

        .leaflet-routing-container {
            background: rgba(15, 23, 42, 0.9) !important;
            color: white !important;
            border-radius: 16px !important;
            border: 1px solid #D4AF37 !important;
            font-family: sans-serif !important;
            font-size: 11px !important;
            max-width: 200px !important;
            display: none !important;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
</head>
<body>
    <div id="activity-map-container"></div>
    <div id="radio-root"></div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const v = urlParams.get('v') || Date.now();
            const script = document.createElement('script');
            script.src = 'webApp.js?v=' + v;
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
