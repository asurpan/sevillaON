    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0F172A; }

        #radio-root {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        #radio-root > * { pointer-events: auto; }

        #activity-map-container {
            display: none;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
            background: #020617;
            pointer-events: auto !important;
        }

        .leaflet-container { background: #020617 !important; }

        .leaflet-routing-container {
            background: rgba(15, 23, 42, 0.9) !important;
            color: white !important;
            border-radius: 16px !important;
            border: 1px solid #D4AF37 !important;
            font-family: sans-serif !important;
            font-size: 11px !important;
            max-width: 200px !important;
            display: none !important;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <div id="radio-root"></div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const v = urlParams.get('v') || Date.now();
            const script = document.createElement('script');
            script.src = 'webApp.js?v=' + v;
            document.body.appendChild(script);
        })();
    </script>
