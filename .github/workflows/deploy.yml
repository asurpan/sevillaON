name: Deploy to GitHub Pages

# --- 🚀 ACTIVADOR DE DESPLIEGUE ---
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Cache Kotlin/JS dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/nodejs
            ~/.gradle/yarn
          key: ${{ runner.os }}-kotlin-js-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-js-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Web App (JS)
        run: ./gradlew :webApp:jsBrowserDistribution --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC"

      - name: Prepare Static Artifact
        run: |
          mkdir -p ./dist/
          cp -rf ./webApp/build/dist/js/productionExecutable/* ./dist/
          cp -f privacy.html ./dist/ || true
          cp -f manifest.json ./dist/ || true
          cp -f index.html ./dist/ || true
          cp -f logo.png ./dist/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
