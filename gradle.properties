#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M -XX:ReservedCodeCacheSize=512m

# --- 🚀 MODO ÉLITE: OPTIMIZACIÓN DE COMPILACIÓN JS ---
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=512m
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
kotlin.incremental.js=true
kotlin.incremental.js.ir=true
# --- 🔒 FIN OPTIMIZACIÓN ---

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.mpp.applyDefaultHierarchyTemplate=true

# Compose Multiplatform Web Experimental
org.jetbrains.compose.experimental.jscanvas.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
