name: Deploy to GitHub Pages

# --- 🚀 ACTIVADOR DE DESPLIEGUE ---
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle & Kotlin JS Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            webApp/build/js
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          add-job-summary: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Web App (JS)
        run: ./gradlew :webApp:jsBrowserDistribution --build-cache --parallel -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Prepare Static Artifact
        run: |
          mkdir -p ./dist/
          cp -rf ./webApp/build/dist/js/productionExecutable/* ./dist/
          cp -f privacy.html ./dist/ || true
          cp -f manifest.json ./dist/ || true
          cp -f index.html ./dist/ || true
          cp -f logo.png ./dist/ || true
          cp -f sw.js ./dist/ || true
          cp -f google9312739a0adb99dd.html ./dist/ || true
          mkdir -p ./dist/.well-known/
          cp -f .well-known/assetlinks.json ./dist/.well-known/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
